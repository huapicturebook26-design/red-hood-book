<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>列印小書</title>
<style>
@page{size:A4 landscape;margin:0}
*{box-sizing:border-box}body{margin:0;background:#e9efe2;font:500 16px/1.6 "PingFang TC","Noto Sans TC",sans-serif;color:#3b4a3e}
.tools{padding:12px 16px;text-align:center}.tools button{font:inherit;font-weight:700;padding:12px 22px;border-radius:16px;border:0;background:#5f9669;color:#fff;cursor:pointer}
.tools p{margin:8px auto;max-width:640px;font-size:14px;color:#6f7f72}
.sheet{width:297mm;height:210mm;position:relative;background:#fff;margin:0 auto;overflow:hidden}
.grid{position:absolute;left:6mm;top:6mm;right:6mm;bottom:6mm;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr}
.p{position:relative;overflow:hidden;padding:1.5mm}.p.rot{transform:rotate(180deg)}
.p img{width:100%;height:100%;object-fit:cover;display:block}
.back{width:100%;height:100%;background:#faf6e8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6mm;text-align:center;color:#5a4c40}
.back b{font-size:34pt}.back span{font-size:9pt}.back i{display:block;width:44mm;border-bottom:.4mm solid #5a4c40;height:8mm}
.fold{position:absolute;border-color:#999;border-style:dashed;border-width:0}
.cut{position:absolute;left:calc(6mm + 71.25mm);width:142.5mm;top:105mm;border-top:.5mm dashed #d91a1a}
.lbl{position:absolute;left:50%;top:105mm;transform:translate(-50%,-50%);background:#fff;color:#d91a1a;font-size:8pt;padding:.5mm 3mm;border-radius:2mm}
.help{max-width:640px;margin:14px auto;padding:0 16px;font-size:15px}
@media print{body{background:#fff}.tools,.help{display:none}.sheet{zoom:1!important;margin:0}}
</style></head><body>
<div class="tools"><button onclick="print()">🖨 列印</button>
<p>紙張選 A4、橫向，縮放 100%，並關閉「頁首頁尾」。印好後沿紅色虛線剪開中間兩格，再照下面的步驟摺。</p></div>
<div class="sheet" id="sheet"><div class="grid" id="grid"></div>
<div class="fold" style="left:6mm;right:6mm;top:105mm;border-top-width:.2mm"></div>
<div class="fold" style="top:6mm;bottom:6mm;left:calc(6mm + 71.25mm);border-left-width:.2mm"></div>
<div class="fold" style="top:6mm;bottom:6mm;left:calc(6mm + 142.5mm);border-left-width:.2mm"></div>
<div class="fold" style="top:6mm;bottom:6mm;left:calc(6mm + 213.75mm);border-left-width:.2mm"></div>
<div class="cut"></div><div class="lbl">沿紅線剪開（只剪中間兩格）</div></div>
<div class="help"><b>怎麼摺：</b><ol>
<li>整張紙橫著對摺（圖在外面），再左右對摺，然後攤開。</li>
<li>只沿紅色虛線剪開中間（兩端不要剪斷）。</li>
<li>再次橫著對摺，兩手捏住左右兩端往中間推，洞會變成菱形。</li>
<li>繼續推成十字，再同方向摺攏壓平，封面朝上就是一本小書。</li></ol></div>
<script>
let b=null;try{b=JSON.parse(localStorage.getItem('rh_book')||'null')}catch(e){}
const g=document.getElementById('grid');
if(!b){g.innerHTML='<p style="grid-column:1/-1;padding:20mm">找不到作品，請回到網站重新製作。</p>'}
else{
 const P={1:b.cover,2:b.pages[0],3:b.pages[1],4:b.pages[2],5:b.pages[3],6:b.pages[4],7:b.pages[5],8:null};
 const ORDER=[[5,1],[4,1],[3,1],[2,1],[6,0],[7,0],[8,0],[1,0]]; // [頁碼, 是否倒轉]
 g.innerHTML=ORDER.map(([n,r])=>`<div class="p ${r?'rot':''}">${n===8?'<div class="back"><b>完</b><span>我的小紅帽故事書</span><i></i><span>作者名字</span></div>':`<img src="${P[n]||''}" alt="第${n}頁">`}</div>`).join('');
}
function fit(){const s=document.getElementById('sheet');s.style.zoom=Math.min(1,(innerWidth-24)/1123)}
fit();addEventListener('resize',fit);
</script></body></html>
