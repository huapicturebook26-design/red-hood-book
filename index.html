<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的小紅帽</title>
<style>
:root{--bg:#e9efe2;--paper:#fbfcf7;--ink:#3b4a3e;--soft:#6f7f72;--line:#cdd8c4;--acc:#5f9669;--sel:#e3f0dc;--red:#d1514a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding:14px 14px 30px}
.box{background:var(--paper);border:2px solid var(--line);border-radius:26px;box-shadow:0 5px 0 rgba(60,80,60,.14)}
.stage{padding:10px 10px 14px;text-align:center}
.hero{display:block;width:min(100%,280px);aspect-ratio:1;object-fit:cover;margin:4px auto 0;border-radius:18px;transform-origin:50% 100%;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.02) rotate(.7deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:50px;margin-top:10px}
.chip{width:46px;height:46px;border-radius:50%;background:var(--sel);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:26px;animation:pop .45s ease}
.chip i{width:30px;height:30px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.card{margin-top:16px;padding:16px 16px 14px}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.dots button{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);background:transparent;padding:0;cursor:pointer}
.dots .done{background:var(--acc);opacity:.55}.dots .now{background:var(--acc);transform:scale(1.3)}
h1{font-size:23px;line-height:1.35;margin:0 0 12px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;padding:12px 6px;font:inherit;color:inherit;background:var(--paper);border:2.5px solid var(--line);border-radius:20px 24px 18px 22px;cursor:pointer}
.opt:active{transform:scale(.96)}.opt.sel{border-color:var(--acc);background:var(--sel);transform:rotate(-1deg)}
.opt .e{font-size:40px;line-height:1.1}.opt .l{font-size:18px;font-weight:700}
.sw{width:46px;height:46px;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.heard{min-height:28px;margin:12px 0 4px;text-align:center;color:var(--soft);font-size:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ghost,.go{font:inherit;font-weight:700;border-radius:18px;padding:10px 14px;min-height:48px;cursor:pointer}
.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.go{background:var(--acc);border:2px solid var(--acc);color:#fff}.go[disabled]{opacity:.4;cursor:default}
.mic{width:88px;height:88px;border-radius:50%;border:none;background:var(--red);color:#fff;font-weight:700;font-size:14px;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 rgba(120,30,25,.35);flex:none}
.mic span{font-size:34px;line-height:1.1}.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(209,81,74,.6)}100%{box-shadow:0 0 0 22px rgba(209,81,74,0)}}
.say{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:8px 12px}.say span{font-size:28px}.say small{font-size:14px}
.center{text-align:center}.note{color:var(--soft);font-size:15px;margin-top:10px}
.cands{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.cands img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;border:3px solid var(--line);cursor:pointer;background:var(--sel)}
.cands img.pick{border-color:var(--acc);transform:scale(1.03)}
.wait{font-size:20px;padding:18px 0}.spin{display:inline-block;animation:sp 1.2s linear infinite;font-size:34px}
@keyframes sp{to{transform:rotate(360deg)}}
.code{display:flex;gap:8px;margin-top:10px}.code input{flex:1;font:inherit;padding:10px;border-radius:14px;border:2px solid var(--line)}
.pages{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.ask{margin:10px 0;padding:12px;background:var(--sel);border-radius:20px}.ask h2{font-size:19px;margin:0 0 8px}
.qc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px}.qc button{font:inherit;font-size:15px;padding:8px 12px;border-radius:16px;border:2px solid var(--line);background:#fff;cursor:pointer}
.ask input{width:100%;font:inherit;padding:10px;border-radius:14px;border:2px solid var(--line);margin-top:8px}
.smic{width:72px;height:72px;font-size:12px}.smic span{font-size:28px}
.cap{font-size:11px;line-height:1.3;margin-top:3px;color:var(--soft);min-height:30px;text-align:left}
.pg{position:relative;aspect-ratio:3/4;border-radius:10px;border:2px solid var(--line);background:var(--sel);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.pg img{width:100%;height:100%;object-fit:cover}.pg b{position:absolute;left:4px;top:3px;background:#fff;border-radius:50%;width:22px;height:22px;font-size:13px;line-height:22px}
.pg button{font:inherit;font-size:14px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:#fff}
.hide{display:none!important}
.ghost:focus-visible,.go:focus-visible,.mic:focus-visible,.opt:focus-visible,.dots button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.hero,.chip,.mic.on,.spin{animation:none}}
</style>
</head>
<body>
<main class="app">
  <div class="box stage"><img class="hero" id="hero" src="base-girl.jpg" alt="小紅帽" onerror="this.onerror=null;this.src='base-girl.JPG'"><div class="chips" id="chips"></div></div>
  <section class="box card">
    <div class="dots" id="dots"></div>
    <h1 id="qt"></h1>
    <div id="vq">
      <div class="opts" id="opts"></div>
      <div class="heard" id="heard" aria-live="polite"></div>
      <div class="bar" id="bar">
        <button class="ghost" id="back">‹ 上一題</button>
        <button class="mic" id="mic" aria-label="按一下，說出答案"><span>🎤</span>說話</button>
        <button class="ghost say" id="say" aria-label="再聽一次問題"><span>👂</span><small>聽問題</small></button>
        <button class="go" id="next">下一題 ›</button>
      </div>
    </div>
    <div id="vr" class="hide center">
      <p>都選好了！按下去，小紅帽就會出現囉。</p>
      <div class="bar" style="justify-content:center;gap:12px"><button class="ghost" id="back2">‹ 回去改</button><button class="go" id="send">畫我的小紅帽 ✨</button></div>
    </div>
    <div id="vw" class="hide center"><div class="wait"><span class="spin">🧺</span><div id="wmsg">小紅帽正在換衣服⋯</div></div></div>
    <div id="vc" class="hide center">
      <div class="cands" id="cands"></div>
      <div class="bar" style="justify-content:center;gap:12px"><button class="ghost" id="again">再畫一次</button><button class="go" id="done" disabled>就是她！</button></div>
    </div>
    <div id="vs" class="hide center"><div class="pages" id="pages"></div><p class="note" id="smsg"></p>
      <div class="ask" id="ask"><h2 id="aq"></h2><div class="qc" id="qc"></div><div class="heard" id="said"></div>
       <div class="bar"><button class="mic smic" id="smic" aria-label="按一下，說出你的想法"><span>🎤</span>說話</button><button class="ghost say" id="sq" aria-label="再聽一次問題"><span>👂</span><small>聽問題</small></button><button class="go" id="sok" disabled>就這樣！</button></div>
       <input id="typed" placeholder="也可以直接打字"></div>
      <div class="bar" style="justify-content:center"><button class="go hide" id="print">🖨 列印小書</button></div></div>
    <div id="vd" class="hide center"><p style="font-size:20px">太棒了，這就是你的小紅帽！</p><p class="note">下一步：用她來演故事（下個版本加入）。</p></div>
    <div id="err" class="note center hide"></div>
    <div id="codebox" class="code hide"><input id="codein" type="password" placeholder="展場通行碼"><button class="go" id="codego">確定</button></div>
  </section>
</main>
<div id="dbg" style="display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:9;background:#b00020;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px"></div>
<script>
function dbg(m){const d=document.getElementById('dbg');d.textContent=m;d.style.display='block'}
addEventListener('error',e=>dbg('程式錯誤：'+e.message));
addEventListener('unhandledrejection',e=>dbg('錯誤：'+((e.reason&&e.reason.message)||e.reason)));
const Q=[
 {k:'gender',t:'小紅帽是男生，還是女生呢？',o:[{id:'girl',l:'女生',e:'👧',w:['女','妹','姊','姐']},{id:'boy',l:'男生',e:'👦',w:['男','弟','哥']}]},
 {k:'hair',t:'頭髮是長長的，還是短短的？',o:[{id:'long',l:'長長的',e:'🎀',w:['長','辮']},{id:'short',l:'短短的',e:'✂️',w:['短','平頭']}]},
 {k:'skin',t:'小紅帽的皮膚是什麼顏色？',o:[{id:'fair',l:'淺淺的',c:'#ffe0c8',w:['白','淺','粉']},{id:'tan',l:'黃黃的',c:'#f0c196',w:['黃','米']},{id:'brown',l:'棕棕的',c:'#c28a5e',w:['棕','咖啡','小麥']},{id:'deep',l:'深深的',c:'#7d5238',w:['黑','深','巧克力']}]},
 {k:'basket',multi:1,t:'水果籃裡有什麼呢？最多三樣喔！',o:[{id:'apple',l:'蘋果',e:'🍎',w:['蘋果']},{id:'bread',l:'麵包',e:'🍞',w:['麵包']},{id:'flower',l:'花',e:'🌸',w:['花']},{id:'cake',l:'蛋糕',e:'🍰',w:['蛋糕']},{id:'berry',l:'草莓',e:'🍓',w:['草莓']},{id:'milk',l:'牛奶',e:'🥛',w:['牛奶']}]}
];
const MAXROUNDS=2;
let ans={basket:[]},step=0,talk=false,rec=null,rounds=0,chosen=null;
const $=i=>document.getElementById(i);
const show=id=>['vq','vr','vw','vc','vd','vs'].forEach(x=>$(x).classList.toggle('hide',x!==id));
const find=(k,id)=>Q.find(q=>q.k===k).o.find(o=>o.id===id);

function say(t){if(!talk||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}
function chips(){
 const h=[];
 ['gender','hair','skin'].forEach(k=>{if(ans[k]){const o=find(k,ans[k]);h.push(`<div class="chip">${o.c?`<i style="background:${o.c}"></i>`:o.e}</div>`)}});
 ans.basket.forEach(id=>h.push(`<div class="chip">${find('basket',id).e}</div>`));
 $('chips').innerHTML=h.join('');
}
function render(quiet){
 const n=Q.length+1;
 $('dots').innerHTML=Array.from({length:n},(_,i)=>`<button aria-label="第${i+1}步" class="${i===step?'now':i<step?'done':''}" data-i="${i}"></button>`).join('');
 $('err').classList.add('hide');$('codebox').classList.add('hide');
 if(step>=Q.length){$('qt').textContent='準備好了嗎？';show('vr');say('都選好了！按下去，小紅帽就會出現囉。');return}
 const q=Q[step];$('qt').textContent=q.t;show('vq');$('heard').textContent='';
 $('opts').innerHTML=q.o.map(o=>{
  const on=q.multi?ans.basket.includes(o.id):ans[q.k]===o.id;
  return `<button class="opt ${on?'sel':''}" data-id="${o.id}" aria-pressed="${on}">${o.c?`<span class="sw" style="background:${o.c}"></span>`:`<span class="e">${o.e}</span>`}<span class="l">${o.l}</span></button>`}).join('');
 $('back').style.visibility=step?'visible':'hidden';
 $('next').textContent=step===Q.length-1?'完成 ✓':'下一題 ›';
 $('next').disabled=q.multi?false:!ans[q.k];
 if(!quiet)say(q.t);
}
function go(n){step=Math.max(0,Math.min(Q.length,n));render()}
function choose(id){
 const q=Q[step];
 if(q.multi){const a=ans.basket,i=a.indexOf(id);if(i>=0)a.splice(i,1);else{a.push(id);if(a.length>3)a.shift()}}
 else ans[q.k]=id;
 chips();render(true);
 if(!q.multi)setTimeout(()=>{if(Q[step]===q)go(step+1)},1100);
}
function match(q,t){const h=[];q.o.forEach(o=>{let s=0;o.w.forEach(w=>{if(t.includes(w))s=Math.max(s,w.length)});if(s)h.push([s,o.id])});return h.sort((a,b)=>b[0]-a[0])}
function heard(t){
 const q=Q[step];if(!q)return;const h=match(q,t);
 if(!h.length){$('heard').textContent=`聽到：「${t}」 沒有對到，再說一次，或用點的也可以喔`;return}
 if(q.multi){h.forEach(([,id])=>{if(!ans.basket.includes(id)){ans.basket.push(id);if(ans.basket.length>3)ans.basket.shift()}});chips();render(true)}
 else choose(h[0][1]);
 $('heard').textContent=`聽到：「${t}」 ✓`;
}
function mic(){
 talk=true;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('heard').textContent='這個瀏覽器不能語音辨識，請用點的，或改用 Chrome／Safari';return}
 if(rec){rec.stop();return}
 if(window.speechSynthesis)speechSynthesis.cancel();
 rec=new SR();rec.lang='zh-TW';rec.interimResults=false;rec.maxAlternatives=3;
 $('mic').classList.add('on');$('heard').textContent='我在聽⋯⋯請說';
 rec.onresult=e=>heard(Array.from(e.results[0]).map(r=>r.transcript).join(' '));
 rec.onerror=e=>{$('heard').textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'麥克風沒有開啟，請允許使用麥克風，或用點的':'沒聽到聲音，再按一次麥克風'};
 rec.onend=()=>{rec=null;$('mic').classList.remove('on')};
 try{rec.start()}catch(_){rec=null;$('mic').classList.remove('on')}
}

const MSG=['小紅帽正在換衣服⋯','正在挑水果籃⋯','蠟筆正在塗顏色⋯','快好了，再等一下下！'];
let wt=null;
async function gen(){
 $('err').classList.add('hide');$('codebox').classList.add('hide');rounds++;chosen=null;$('done').disabled=true;show('vw');$('qt').textContent='畫畫中';
 let i=0;$('wmsg').textContent=MSG[0];wt=setInterval(()=>{$('wmsg').textContent=MSG[++i%MSG.length]},3500);
 try{
  const r=await fetch('/api/character',{method:'POST',headers:{'Content-Type':'application/json','x-access-code':sessionStorage.getItem('code')||''},body:JSON.stringify(ans)});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){rounds--;fail('需要輸入展場通行碼',true);return}
  if(!r.ok||!d.images)throw new Error(d.error||'沒畫出來');
  clearInterval(wt);document.getElementById('dbg').style.display='none';$('qt').textContent='選一張你最喜歡的！';
  $('cands').innerHTML=d.images.map(u=>`<img src="${u}" alt="小紅帽" data-u="${u}">`).join('');
  $('again').classList.toggle('hide',rounds>=MAXROUNDS);show('vc');
 }catch(e){fail(e.message,false)}
}
function fail(m,needCode){
 clearInterval(wt);dbg('失敗：'+m);show('vr');$('qt').textContent='準備好了嗎？';
 $('err').textContent=m;$('err').classList.remove('hide');$('codebox').classList.toggle('hide',!needCode);
}
$('opts').addEventListener('click',e=>{const b=e.target.closest('.opt');if(b){talk=true;choose(b.dataset.id)}});
$('dots').addEventListener('click',e=>{const b=e.target.closest('button');if(b){talk=true;go(+b.dataset.i)}});
$('cands').addEventListener('click',e=>{const im=e.target.closest('img');if(!im)return;
 document.querySelectorAll('#cands img').forEach(x=>x.classList.remove('pick'));im.classList.add('pick');chosen=im.dataset.u;$('done').disabled=false});
$('mic').onclick=mic;
$('say').onclick=()=>{talk=true;say(step>=Q.length?'都選好了！按下去，小紅帽就會出現囉。':Q[step].t)};
$('back').onclick=()=>{talk=true;go(step-1)};
$('back2').onclick=()=>go(Q.length-1);
$('next').onclick=()=>{talk=true;go(step+1)};
$('send').onclick=()=>{try{talk=true;dbg('已送出，正在畫圖，請等 15～30 秒⋯');gen()}catch(e){dbg('按鈕錯誤：'+e.message)}};
$('again').onclick=gen;
$('codego').onclick=()=>{sessionStorage.setItem('code',$('codein').value.trim());gen()};
$('done').onclick=()=>{
 sessionStorage.setItem('rh_char',JSON.stringify({url:chosen,ans}));
 $('hero').src=chosen;$('hero').style.aspectRatio='3/4';$('chips').innerHTML='';
 story();
};
let book=null,chain=Promise.resolve(),pending='',node=0,said={};
const NODES=[
 {p:3,q:'小紅帽在森林裡遇到大野狼了！這隻大野狼是什麼樣子？牠說了什麼？',c:['一隻害羞的大野狼','一隻戴著帽子的大野狼','一隻肚子餓的大野狼','一隻愛講笑話的大野狼']},
 {p:4,q:'接下來，小紅帽怎麼做呢？',c:['照媽媽的話走大路','去摘漂亮的花','請大野狼一起走','跟著小鳥走']},
 {p:6,q:'外婆家出了狀況！誰來幫忙？怎麼幫忙？',c:['媽媽來幫忙','森林裡的小動物們','小紅帽自己想辦法','獵人叔叔來幫忙']}];
function slot(p,h){$('pg'+p).innerHTML=`<b>${p}</b>`+h}
function code(){return {'Content-Type':'application/json','x-access-code':sessionStorage.getItem('code')||''}}
function progress(){
 const n=book.pages.filter(Boolean).length;
 const ml=window.lastMode?(window.lastMode==='gemini'?'Gemini 模式':'備用翻譯模式（Gemini 沒有啟用）'):'';
 $('smsg').textContent=(n<7?`已畫好 ${n} / 7 頁　`:'')+ml;
 if(n===7){$('qt').textContent='你的故事書完成了！';$('print').classList.remove('hide');localStorage.setItem('rh_book',JSON.stringify(book));say('你的故事書完成了！')}
}
async function genPage(p){
 slot(p,'🖍️');
 const hist=book.pages.slice(0,p-2).map((x,i)=>x&&{p:i+2,caption:x.caption,cast:x.cast}).filter(Boolean);
 try{
  const r=await fetch('/api/page',{method:'POST',headers:code(),body:JSON.stringify({image:book.cover,page:p,said:said[p]||'',history:hist})});
  const d=await r.json().catch(()=>({}));
  if(r.status===401){sessionStorage.removeItem('code');throw new Error('code')}
  if(!r.ok||!d.image)throw new Error((d.error||'失敗')+(d.detail?' '+JSON.stringify(d.detail).slice(0,300):''));
  book.pages[p-2]={image:d.image,caption:d.caption,cast:d.cast};window.lastMode=d.mode;$('cap'+p).textContent=d.caption||'';
  slot(p,`<img src="${d.image}" alt="第${p}頁">`);
 }catch(e){slot(p,`<button data-r="${p}">重畫</button>`);dbg('第'+p+'頁失敗：'+e.message)}
 progress();
}
const queue=p=>{chain=chain.then(()=>genPage(p))};
function story(){
 book={cover:chosen,pages:Array(7).fill(null)};said={};node=0;chain=Promise.resolve();
 $('qt').textContent='一起來編故事吧！';show('vs');$('print').classList.add('hide');
 $('pages').innerHTML=book.pages.map((_,i)=>`<div><div class="pg" id="pg${i+2}"><b>${i+2}</b>🖍️</div><div class="cap" id="cap${i+2}"></div></div>`).join('');
 queue(2);ask();
}
function ask(){
 pending='';$('sok').disabled=true;$('said').textContent='';$('typed').value='';
 if(node>=NODES.length){$('ask').classList.add('hide');$('smsg').textContent='故事繪製中，請稍等⋯';return}
 const n=NODES[node];$('ask').classList.remove('hide');$('aq').textContent=n.q;
 $('qc').innerHTML=n.c.map(c=>`<button>${c}</button>`).join('');say(n.q);
}
function setSaid(t){pending=t.trim();$('said').textContent=pending?`我聽到：「${pending}」`:'';$('sok').disabled=!pending}
function listen(){
 talk=true;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){$('said').textContent='這個瀏覽器不能語音辨識，請點選項或打字';return}
 if(rec){rec.stop();return}
 if(window.speechSynthesis)speechSynthesis.cancel();
 rec=new SR();rec.lang='zh-TW';rec.interimResults=false;
 $('smic').classList.add('on');$('said').textContent='我在聽⋯⋯請說';
 rec.onresult=e=>setSaid(e.results[0][0].transcript);
 rec.onerror=()=>{$('said').textContent='沒聽到，再按一次麥克風，或點選項、打字'};
 rec.onend=()=>{rec=null;$('smic').classList.remove('on')};
 try{rec.start()}catch(_){rec=null;$('smic').classList.remove('on')}
}
function answer(){
 if(!pending)return;const n=NODES[node];said[n.p]=pending;queue(n.p);
 if(n.p===4)queue(5);
 if(n.p===6){queue(7);queue(8)}
 node++;ask();
}
$('qc').addEventListener('click',e=>{const b=e.target.closest('button');if(b){talk=true;setSaid(b.textContent)}});
$('typed').addEventListener('input',e=>setSaid(e.target.value));
$('smic').onclick=listen;$('sok').onclick=answer;
$('sq').onclick=()=>{talk=true;if(node<NODES.length)say(NODES[node].q)};
$('pages').addEventListener('click',e=>{const b=e.target.closest('button');if(b){const p=+b.dataset.r;chain=chain.then(()=>genPage(p))}});
$('print').onclick=()=>window.open('print.html','_blank');
render();
</script>
</body>
</html>
