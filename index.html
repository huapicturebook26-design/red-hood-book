<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>我的小紅帽</title>
<style>
:root{--bg:#e4ebd9;--paper:#fbfaf3;--ink:#3b4a3e;--soft:#6f7f72;--line:#cdd8c4;--acc:#5f9669;--sel:#e3f0dc;--red:#d1514a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center;font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-weight:500}
.stage{position:relative;width:min(100vw - 12px,(100vh - 12px)*1.6);aspect-ratio:16/10;font-size:calc(var(--u,10px)*1.5);line-height:1.45}
.bk{position:absolute;left:0;right:0;top:0;bottom:9%;transform-origin:50% 50%;transition:transform 1.2s cubic-bezier(.5,0,.2,1),opacity 1s}
.bk.shrunk{transform:scale(.4);opacity:0;pointer-events:none}
.book{position:absolute;inset:.8%;perspective:240em;border-radius:2.2em;box-shadow:0 .7em 0 #bd6355,0 1.4em 2.2em rgba(0,0,0,.28)}
.pg{position:absolute;top:0;bottom:0;width:50%;padding:3.2% 3.6%;background:var(--paper);display:flex;flex-direction:column;overflow:hidden;min-height:0}
.pg.L{left:0;border-radius:2.2em 0 0 2.2em;background:linear-gradient(90deg,#fbfaf3 90%,#e8e4d3)}
.pg.R{left:50%;border-radius:0 2.2em 2.2em 0;background:linear-gradient(270deg,#fbfaf3 90%,#e8e4d3)}
.leaf{position:absolute;top:0;bottom:0;width:50%;display:none;transform-style:preserve-3d;z-index:5}
.leaf .f{position:absolute;inset:0!important;width:100%!important;left:0!important;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 0 1.5em rgba(0,0,0,.2)}
.leaf .back{transform:rotateY(180deg)}
.ghost{position:absolute;top:0;bottom:0;z-index:4}
.fig{flex:1;min-height:0;border-radius:1.1em;overflow:hidden;background:#eef3e6;position:relative;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--soft)}
.fig img{width:100%;height:100%;object-fit:cover;animation:in .9s}
@keyframes in{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.fig .ov{position:absolute;inset:auto 0 0 0;background:rgba(251,250,243,.9);padding:.6em;font-size:1.1em}
h1{font-size:1.5em;line-height:1.35;margin:.3em 0 .5em;text-align:center}
.dots{display:flex;gap:.5em;justify-content:center}.dots button{width:.9em;height:.9em;border-radius:50%;border:2px solid var(--acc);background:transparent;padding:0}
.dots .done{background:var(--acc);opacity:.55}.dots .now{background:var(--acc);transform:scale(1.3)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5em,1fr));gap:.6em}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;min-height:5.2em;padding:.5em .3em;font:inherit;color:inherit;background:var(--paper);border:.16em solid var(--line);border-radius:1.2em 1.4em 1.1em 1.3em;cursor:pointer}
.opt.sel{border-color:var(--acc);background:var(--sel);transform:rotate(-1deg)}
.opt .e{font-size:2.1em;line-height:1.1}.opt .l{font-size:1.05em;font-weight:700}
.sw{width:2.4em;height:2.4em;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
.heard{min-height:1.6em;margin:.5em 0 .2em;text-align:center;color:var(--soft);font-size:.95em}
.bar{display:flex;align-items:center;justify-content:space-between;gap:.5em;margin-top:auto}
.btn{font:inherit;font-weight:700;border-radius:1.1em;padding:.5em .9em;min-height:2.6em;cursor:pointer;background:transparent;border:.14em solid var(--line);color:var(--ink)}
.go{background:var(--acc);border-color:var(--acc);color:#fff}.btn[disabled]{opacity:.4;cursor:default}
.mic{width:4.6em;height:4.6em;border-radius:50%;border:none;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:.8em;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 .3em 0 rgba(120,30,25,.35);flex:none}
.mic span{font-size:2em;line-height:1.1}.mic.on{animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(209,81,74,.6)}100%{box-shadow:0 0 0 1.3em rgba(209,81,74,0)}}
.say{display:flex;flex-direction:column;align-items:center;line-height:1.1;padding:.4em .6em}.say span{font-size:1.6em}.say small{font-size:.75em}
.chips{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;min-height:2.8em;margin-top:.5em}
.chip{width:2.7em;height:2.7em;border-radius:50%;background:var(--sel);border:2px solid var(--acc);display:flex;align-items:center;justify-content:center;font-size:1.5em;animation:pop .45s}
.chip i{width:1.7em;height:1.7em;border-radius:50%;border:2px solid rgba(0,0,0,.25)}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.cands{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.cands img{width:100%;height:100%;min-height:0;object-fit:cover;border-radius:1em;border:.2em solid var(--line);background:var(--sel);cursor:pointer}
.cands img.pick{border-color:var(--acc);transform:scale(1.02)}
.cap{font-size:1.65em;line-height:1.7;font-weight:700;text-align:center;margin:auto 0;padding:0 .3em;animation:in .8s}
.small{color:var(--soft);font-size:.8em;text-align:center}
.ask{margin-top:.4em;padding:.6em .7em;background:var(--sel);border-radius:1.2em}
.ask h2{font-size:1.05em;margin:0 0 .4em;line-height:1.35}
.qc{display:flex;flex-wrap:wrap;gap:.35em;margin-bottom:.35em}.qc button{font:inherit;font-size:.8em;padding:.3em .6em;border-radius:1em;border:2px solid var(--line);background:#fff;cursor:pointer}
.ask input,.nmf input{width:100%;font:inherit;padding:.4em .6em;border-radius:.8em;border:2px solid var(--line);margin-top:.3em}
.ask .bar{margin-top:.2em}.ask .mic{width:3.8em;height:3.8em;font-size:.7em}
.big{font-size:2.4em;font-weight:800;text-align:center;margin:auto 0 .2em}
.nmf{margin:auto 0;text-align:center}.nmf .row{display:flex;gap:.5em;align-items:center;justify-content:center;margin:.5em 0}
.back-cover{background:linear-gradient(135deg,#d9efd8,#f4ecd3)}
.nav{position:absolute;left:0;right:0;bottom:0;height:8%;display:none;align-items:center;justify-content:center;gap:1em}.nav.on{display:flex}
.mini{position:absolute;left:50%;top:46%;width:24%;aspect-ratio:3/4;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;transition:transform 1.2s cubic-bezier(.5,0,.2,1),opacity .9s,left 1.1s;border-radius:.4em 1em 1em .4em;background:#c0584c;padding:.5em .5em .5em 1.1em;box-shadow:0 .5em 0 #9d4338,0 1em 1.8em rgba(0,0,0,.3);display:flex;flex-direction:column;gap:.3em}
.mini.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mini.opening{opacity:0;transform:translate(-50%,-50%) scale(2.4)}
.mini.left{left:27%}
.mini img{flex:1;min-height:0;width:100%;object-fit:cover;border-radius:.5em}
.mt{color:#fff;font-weight:800;text-align:center;font-size:1.05em}.ma{color:#ffe9d6;text-align:center;font-size:.8em;min-height:1.2em}
.side{position:absolute;left:52%;right:3%;top:8%;bottom:17%;background:var(--paper);border-radius:1.6em;box-shadow:0 .5em 0 rgba(60,80,60,.14);padding:2em;display:none;flex-direction:column;justify-content:center;gap:.8em;text-align:center;opacity:0}
.side.on{display:flex;animation:in .9s forwards}
.side .btn{font-size:1.1em}.qr{border:.15em dashed var(--line);border-radius:1em;padding:.8em;color:var(--soft);font-size:.9em}
#rot{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);align-items:center;justify-content:center;font-size:24px;text-align:center}
@media (orientation:portrait){#rot{display:flex}}
.hide{display:none!important}
</style>
</head>
<body>
<div id="rot">📱↻<br>請把平板橫過來，<br>像打開一本書一樣</div>
<div class="stage" id="stage">
  <div class="bk" id="bk">
    <div class="book" id="book">
      <div class="pg L" id="L"></div><div class="pg R" id="R"></div>
      <div class="leaf" id="leaf"><div class="f pg front"></div><div class="f pg back"></div></div>
    </div>
  </div>
  <div class="mini" id="mini"><img id="mimg" alt="封面"><div class="mt">我的小紅帽</div><div class="ma" id="ma"></div></div>
  <div class="side" id="side">
    <div style="font-size:2em">🎉</div>
    <div style="font-size:1.6em;font-weight:800">你的小書做好囉！</div>
    <button class="btn go" data-act="print">🖨 列印小書</button>
    <button class="btn go" data-act="dl">⬇ 下載 PDF</button>
    <div class="qr">📱 掃 QR Code 帶走（下一版加入）</div>
    <button class="btn" data-act="restart">再做一本</button>
  </div>
  <div class="nav" id="nav"><button class="btn" data-act="prevp">‹ 上一頁</button><button class="btn go" data-act="nextp" id="nextp">下一頁 ›</button><button class="btn" data-act="lastp">封底 ⏭</button></div>
</div>
<div id="dbg" style="display:none;position:fixed;left:8px;right:8px;bottom:8px;z-index:30;background:#b00020;color:#fff;padding:10px 14px;border-radius:12px;font-size:14px"></div>
<script>
function dbg(m){const d=document.getElementById('dbg');d.textContent=m;d.style.display='block'}
addEventListener('error',e=>dbg('程式錯誤：'+e.message));
addEventListener('unhandledrejection',e=>dbg('錯誤：'+((e.reason&&e.reason.message)||e.reason)));
const $=i=>document.getElementById(i),sleep=ms=>new Promise(r=>setTimeout(r,ms)),TM=()=>window.__T||1;
function fit(){const s=$('stage');document.documentElement.style.setProperty('--u',(s.clientWidth/100)+'px')}
addEventListener('resize',fit);fit();

const Q=[
 {k:'gender',t:'小紅帽是男生，還是女生呢？',o:[{id:'girl',l:'女生',e:'👧',w:['女','妹','姊','姐']},{id:'boy',l:'男生',e:'👦',w:['男','弟','哥']}]},
 {k:'hair',t:'頭髮是長長的，還是短短的？',o:[{id:'long',l:'長長的',e:'🎀',w:['長','辮']},{id:'short',l:'短短的',e:'✂️',w:['短','平頭']}]},
 {k:'skin',t:'小紅帽的皮膚是什麼顏色？',o:[{id:'fair',l:'淺淺的',c:'#ffe0c8',w:['白','淺','粉']},{id:'tan',l:'黃黃的',c:'#f0c196',w:['黃','米']},{id:'brown',l:'棕棕的',c:'#c28a5e',w:['棕','咖啡','小麥']},{id:'deep',l:'深深的',c:'#7d5238',w:['黑','深','巧克力']}]},
 {k:'basket',multi:1,t:'水果籃裡有什麼呢？最多三樣喔！',o:[{id:'apple',l:'蘋果',e:'🍎',w:['蘋果']},{id:'bread',l:'麵包',e:'🍞',w:['麵包']},{id:'flower',l:'花',e:'🌸',w:['花']},{id:'cake',l:'蛋糕',e:'🍰',w:['蛋糕']},{id:'berry',l:'草莓',e:'🍓',w:['草莓']},{id:'milk',l:'牛奶',e:'🥛',w:['牛奶']}]}
];
const NODES=[
 {p:3,q:'小紅帽在森林裡遇到大野狼了！這隻大野狼是什麼樣子？牠說了什麼？',c:['一隻害羞的大野狼','一隻戴著帽子的大野狼','一隻肚子餓的大野狼','一隻愛講笑話的大野狼']},
 {p:4,q:'接下來，小紅帽怎麼做呢？',c:['照媽媽的話走大路','去摘漂亮的花','請大野狼一起走','跟著小鳥走']},
 {p:6,q:'外婆家出了狀況！誰來幫忙？怎麼幫忙？',c:['媽媽來幫忙','森林裡的小動物們','小紅帽自己想辦法','獵人叔叔來幫忙']}];
const MAXROUNDS=2;
let mode='design',ans={basket:[]},step=0,talk=false,rec=null,rounds=0,chosen=null,phase='q'; // phase: q|ready|wait|cands
let book=null,st={},said={},node=0,pending='',cur=1,timer=null,tcur=0,chain=Promise.resolve(),flipping=false,wt=null,srvVer='',lastMode='',lastErr='';
const find=(k,id)=>Q.find(q=>q.k===k).o.find(o=>o.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function say(t){if(!talk||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-TW';u.rate=.9;speechSynthesis.speak(u)}

/* ---------- 翻頁 ---------- */
const strip=h=>h.replace(/ id="[^"]*"/g,'');
function turn(update,dir){
 dir=dir||1;
 if(flipping){update();return Promise.resolve()}
 flipping=true;
 const L=$('L'),R=$('R'),leaf=$('leaf'),f=leaf.querySelector('.front'),b=leaf.querySelector('.back');
 const old=dir>0?R:L, oldHtml=strip(old.innerHTML);
 const ghost=document.createElement('div');ghost.className='pg ghost '+(dir>0?'L':'R');
 const stay=dir>0?L:R;ghost.innerHTML=strip(stay.innerHTML);ghost.style.left=dir>0?'0':'50%';ghost.style.width='50%';
 $('book').appendChild(ghost);
 f.className='f pg front '+(dir>0?'R':'L');f.innerHTML=oldHtml;
 update();
 b.className='f pg back '+(dir>0?'L':'R');b.innerHTML=strip((dir>0?L:R).innerHTML);
 leaf.style.display='block';leaf.style.transition='none';
 leaf.style.left=dir>0?'50%':'0';leaf.style.transformOrigin=dir>0?'left center':'right center';leaf.style.transform='rotateY(0deg)';
 void leaf.offsetWidth;
 const d=1000*TM();leaf.style.transition=`transform ${d}ms cubic-bezier(.45,.05,.3,1)`;leaf.style.transform=`rotateY(${dir>0?-180:180}deg)`;
 return new Promise(res=>{
  setTimeout(()=>ghost.remove(),d*.5);
  setTimeout(()=>{leaf.style.display='none';leaf.style.transition='none';flipping=false;res()},d+40);
 });
}

/* ---------- 設計階段 ---------- */
function chipsHtml(){
 const h=[];['gender','hair','skin'].forEach(k=>{if(ans[k]){const o=find(k,ans[k]);h.push(`<div class="chip">${o.c?`<i style="background:${o.c}"></i>`:o.e}</div>`)}});
 ans.basket.forEach(id=>h.push(`<div class="chip">${find('basket',id).e}</div>`));return h.join('');
}
const MSG=['小紅帽正在換衣服⋯','正在挑水果籃⋯','蠟筆正在塗顏色⋯','快好了，再等一下下！'];
function paintDesign(quiet){
 const n=Q.length+1;let L='',R='';
 const dots=`<div class="dots">${Array.from({length:n},(_,i)=>`<button data-act="dot" data-i="${i}" aria-label="第${i+1}步" class="${i===step&&phase==='q'||(phase!=='q'&&i===n-1)?'now':i<step?'done':''}"></button>`).join('')}</div>`;
 if(phase==='q'){
  const q=Q[step];
  L=`${dots}<h1>${q.t}</h1><div class="opts">${q.o.map(o=>{const on=q.multi?ans.basket.includes(o.id):ans[q.k]===o.id;
   return `<button class="opt ${on?'sel':''}" data-act="opt" data-id="${o.id}">${o.c?`<span class="sw" style="background:${o.c}"></span>`:`<span class="e">${o.e}</span>`}<span class="l">${o.l}</span></button>`}).join('')}</div>
   <div class="heard" id="heard"></div>
   <div class="bar"><button class="btn" data-act="back" style="visibility:${step?'visible':'hidden'}">‹ 上一題</button>
   <button class="mic" id="mic" data-act="mic"><span>🎤</span>說話</button>
   <button class="btn say" data-act="sayq"><span>👂</span><small>聽問題</small></button>
   <button class="btn go" data-act="next" ${q.multi||ans[q.k]?'':'disabled'}>${step===Q.length-1?'完成 ✓':'下一題 ›'}</button></div>`;
  R=`<div class="fig"><img src="${esc(window.heroSrc||'base-girl.jpg')}" alt="小紅帽" onerror="this.onerror=null;this.src='base-girl.JPG'"></div><div class="chips">${chipsHtml()}</div>`;
 }else if(phase==='ready'){
  L=`${dots}<h1>準備好了嗎？</h1><p style="text-align:center;font-size:1.1em">都選好了！按下去，<br>小紅帽就會出現囉。</p><div id="err" class="small"></div>
   <div class="bar" style="justify-content:center;gap:1em"><button class="btn" data-act="back2">‹ 回去改</button><button class="btn go" data-act="send">畫我的小紅帽 ✨</button></div>`;
  R=`<div class="fig"><img src="base-girl.jpg" alt="小紅帽" onerror="this.onerror=null;this.src='base-girl.JPG'"></div><div class="chips">${chipsHtml()}</div>`;
 }else if(phase==='wait'){
  L=`${dots}<h1>畫畫中⋯</h1><p style="text-align:center;font-size:1.3em" id="wmsg">${MSG[0]}</p><div class="small">大約 15～30 秒</div>`;
  R=`<div class="fig"><img src="base-girl.jpg" style="opacity:.5" alt=""><div class="ov">🖍️ 蠟筆在畫你的小紅帽</div></div>`;
 }else{
  L=`${dots}<h1>選一張你最喜歡的！</h1><p style="text-align:center">點一下圖片，再按「就是她！」</p>
   <div class="bar" style="justify-content:center;gap:1em"><button class="btn ${rounds>=MAXROUNDS?'hide':''}" data-act="again">再畫一次</button><button class="btn go" id="done" data-act="done" ${chosen?'':'disabled'}>就是她！</button></div>`;
  R=`<div class="cands">${window.cands.map(u=>`<img src="${esc(u)}" alt="小紅帽" data-act="pick" data-u="${esc(u)}" class="${u===chosen?'pick':''}">`).join('')}</div>`;
 }
 $('L').innerHTML=L;$('R').innerHTML=R;
 if(phase==='q'&&!quiet)say(Q[step].t);
}
function goStep(n){phase='q';step=Math.max(0,Math.min(Q.length,n));if(step>=Q.length){phase='ready';say('都選好了！按下去，小紅帽就會出現囉。')}paintDesign()}
function choose(id){
 const q=Q[step];
 if(q.multi){const a=ans.basket,i=a.indexOf(id);if(i>=0)a.splice(i,1);else{a.push(id);if(a.length>3)a.shift()}}else ans[q.k]=id;
 paintDesign(true);
 if(!q.multi)setTimeout(()=>{if(phase==='q'&&Q[step]===q)goStep(step+1)},1100*TM());
}
function match(q,t){const h=[];q.o.forEach(o=>{let s=0;o.w.forEach(w=>{if(t.includes(w))s=Math.max(s,w.length)});if(s)h.push([s,o.id])});return h.sort((a,b)=>b[0]-a[0])}
function heardAns(t){
 const q=Q[step],H=$('heard');if(!q||phase!=='q')return;const h=match(q,t);
 if(!h.length){H.textContent=`聽到：「${t}」 沒有對到，再說一次，或用點的也可以喔`;return}
 if(q.multi){h.forEach(([,id])=>{if(!ans.basket.includes(id)){ans.basket.push(id);if(ans.basket.length>3)ans.basket.shift()}});paintDesign(true)}else choose(h[0][1]);
 const H2=$('heard');if(H2)H2.textContent=`聽到：「${t}」 ✓`;
}
function listen(btnId,hintId,cb){
 talk=true;const SR=window.SpeechRecognition||window.webkitSpeechRecognition,h=$(hintId);
 if(!SR){h.textContent='這個瀏覽器不能語音辨識，請用點的或打字，或改用 Chrome／Safari';return}
 if(rec){rec.stop();return}
 if(window.speechSynthesis)speechSynthesis.cancel();
 rec=new SR();rec.lang='zh-TW';rec.interimResults=false;rec.maxAlternatives=3;
 $(btnId).classList.add('on');h.textContent='我在聽⋯⋯請說';
 rec.onresult=e=>cb(Array.from(e.results[0]).map(r=>r.transcript).join(' '),e.results[0][0].transcript);
 rec.onerror=e=>{const x=$(hintId);if(x)x.textContent=(e.error==='not-allowed'||e.error==='service-not-allowed')?'麥克風沒有開啟，請允許使用麥克風，或用點的':'沒聽到聲音，再按一次麥克風'};
 rec.onend=()=>{rec=null;const b=$(btnId);if(b)b.classList.remove('on')};
 try{rec.start()}catch(_){rec=null;$(btnId).classList.remove('on')}
}
const hdr=()=>({'Content-Type':'application/json','x-access-code':sessionStorage.getItem('code')||''});
async function genChar(){
 rounds++;chosen=null;phase='wait';paintDesign();
 let i=0;clearInterval(wt);wt=setInterval(()=>{const w=$('wmsg');if(w)w.textContent=MSG[++i%MSG.length]},3500*TM());
 try{
  let r=await fetch('/api/character',{method:'POST',headers:hdr(),body:JSON.stringify(ans)});
  if(r.status===401){const c=prompt('請輸入展場通行碼');if(c){sessionStorage.setItem('code',c.trim());r=await fetch('/api/character',{method:'POST',headers:hdr(),body:JSON.stringify(ans)})}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.images)throw new Error(d.error||(r.status===401?'通行碼不對':'沒畫出來'));
  clearInterval(wt);window.cands=d.images;phase='cands';paintDesign();
 }catch(e){clearInterval(wt);rounds--;phase='ready';paintDesign();dbg('失敗：'+e.message);const x=$('err');if(x)x.textContent=e.message}
}

/* ---------- 故事階段 ---------- */
const allDone=()=>[2,3,4,5,6,7,8].every(p=>st[p]==='ok');
function imgOf(p){return book.pages[p-2]}
function paintImg(){
 const R=$('rimg');if(!R||mode==='design')return;const p=cur;
 if(p===1){R.innerHTML=`<img src="${esc(book.cover)}" alt="封面">`;return}
 if(st[p]==='ok')R.innerHTML=`<img src="${esc(imgOf(p).image)}" alt="第${p}頁">`;
 else if(st[p]==='fail')R.innerHTML=`<div><div style="font-size:2em">😢</div><button class="btn go" data-act="retry" data-p="${p}">重畫這一頁</button></div>`;
 else if(st[p]==='busy')R.innerHTML=`<div><div style="font-size:3em">🖍️</div>蠟筆正在畫第 ${p} 頁⋯</div>`;
 else R.innerHTML=`<div><div style="font-size:3em">💭</div>等你說出點子，<br>這一頁才畫得出來喔</div>`;
}
function paintCap(){
 const C=$('lcap');if(!C)return;const p=cur;
 if(p===1)C.innerHTML=`<div class="big">我的小紅帽</div><div class="small" style="font-size:1.1em">${book.author?'作者：'+esc(book.author):'一個我們一起畫出來的故事'}</div>`;
 else if(st[p]==='ok')C.innerHTML=`<div class="cap">${esc(imgOf(p).caption||'')}</div>`;
 else C.innerHTML=`<div class="cap" style="color:var(--soft);font-weight:500">${st[p]==='fail'?'這一頁沒畫出來':st[p]==='busy'?'故事正在變出來⋯':'故事等著你的點子⋯'}</div>`;
}
function askHtml(){
 if(mode!=='story'||node>=NODES.length)return '';
 const n=NODES[node];
 return `<div class="ask"><h2>${n.q}</h2><div class="qc">${n.c.map(c=>`<button data-act="chip">${c}</button>`).join('')}</div>
 <div class="heard" id="said" style="margin:.1em 0">${pending?`我聽到：「${esc(pending)}」`:''}</div>
 <div class="bar"><button class="mic" id="smic" data-act="smic"><span>🎤</span>說話</button><button class="btn say" data-act="sq"><span>👂</span><small>聽問題</small></button><button class="btn go" id="sok" data-act="sok" ${pending?'':'disabled'}>就這樣！</button></div>
 <input id="typed" placeholder="也可以直接打字" value="${esc(pending)}"></div>`;
}
function paintStat(){
 const s=$('stat');if(!s)return;const n=[2,3,4,5,6,7,8].filter(p=>st[p]==='ok').length;
 const ml=lastMode?(lastMode==='gemini'?'Gemini 模式':'備用翻譯模式｜Gemini 原因：'+(lastErr||'未知')):'';
 s.textContent=mode==='story'?(`已畫好 ${n} / 7 頁　`+ml+(srvVer?`　｜　${srvVer}`:'')):'';
}
function spreadHtml(n){
 cur=n;
 if(n===9){
  $('L').innerHTML=`<div class="big">完 🌟</div><div class="cap" style="font-size:1.3em;margin:0 0 auto">謝謝你和小紅帽一起<br>走完這段故事！</div>`;
  $('R').className='pg R back-cover';
  $('R').innerHTML=book.author?`<div class="nmf"><div style="font-size:1.1em">作者</div><div class="big" style="margin-top:.2em">${esc(book.author)}</div></div>`:
   `<div class="nmf"><div style="font-size:1.3em;font-weight:800">封底</div><p style="margin:.3em 0">請說出（或寫下）作者的名字：</p>
    <div class="row"><button class="mic" id="nmic" data-act="nmic"><span>🎤</span>說名字</button></div>
    <div class="heard" id="nhint"></div><input id="nm" placeholder="作者的名字" maxlength="12">
    <div class="row"><button class="btn go" data-act="nameok">完成 ✓</button></div></div>`;
  return;
 }
 $('R').className='pg R';
 $('L').innerHTML=`<div id="lcap" style="flex:1;display:flex;flex-direction:column;min-height:0"></div>${askHtml()}<div class="small" id="stat" style="margin-top:.3em"></div>`;
 $('R').innerHTML=`<div class="fig" id="rimg"></div>`;
 paintCap();paintImg();paintStat();
}
function go(n,dir){
 clearTimeout(timer);timer=null;
 return turn(()=>spreadHtml(n),dir||(n>=cur?1:-1)).then(()=>{if(mode==='story')tick()});
}
function tick(){
 if(mode!=='story')return;
 const rdy=cur===1||st[cur]==='ok';if(!rdy)return;
 if(timer&&tcur===cur)return;
 clearTimeout(timer);tcur=cur;
 if(cur<8)timer=setTimeout(()=>{timer=null;if(mode==='story')go(cur+1,1)},5000*TM());
 else timer=setTimeout(()=>{timer=null;if(mode==='story'&&allDone())finale();else tick()},5000*TM());
}
async function genPage(p){
 st[p]='busy';if(cur===p){paintImg();paintCap()}
 const hist=book.pages.slice(0,p-2).map((x,i)=>x&&{p:i+2,caption:x.caption,cast:x.cast}).filter(Boolean);
 try{
  let r=await fetch('/api/page',{method:'POST',headers:hdr(),body:JSON.stringify({image:book.cover,page:p,said:said[p]||'',history:hist})});
  if(r.status===401){const c=prompt('請輸入展場通行碼');if(c){sessionStorage.setItem('code',c.trim());r=await fetch('/api/page',{method:'POST',headers:hdr(),body:JSON.stringify({image:book.cover,page:p,said:said[p]||'',history:hist})})}}
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.image)throw new Error((d.error||'失敗')+(d.detail?' '+JSON.stringify(d.detail).slice(0,300):''));
  book.pages[p-2]={image:d.image,caption:d.caption,cast:d.cast};st[p]='ok';
  if(d.mode!=='fixed'){lastMode=d.mode;lastErr=d.gerr||''}
  localStorage.setItem('rh_book',JSON.stringify(book));
 }catch(e){st[p]='fail';dbg('第'+p+'頁失敗：'+e.message)}
 if(cur===p){paintImg();paintCap()}
 paintStat();tick();
}
const queue=p=>{st[p]='busy';chain=chain.then(()=>genPage(p))};
function startStory(){
 mode='story';book={cover:chosen,pages:Array(7).fill(null)};st={};said={};node=0;pending='';cur=1;chain=Promise.resolve();
 try{localStorage.setItem('rh_book',JSON.stringify(book))}catch(_){}
 srvVer='檢查中';fetch('/api/page').then(r=>r.text()).then(t=>{srvVer=/^page\.js v\d+/.test(t)?t:'⚠️ 伺服器還是舊版 page.js';paintStat()}).catch(()=>{srvVer='?'});
 $('mimg').src=chosen;
 for(let p=3;p<=8;p++)st[p]='idle';
 queue(2);
 turn(()=>spreadHtml(1),1).then(tick);
 say('這是你的小紅帽！我們一起來編故事吧。');
}
function setSaid(t){pending=t.trim();const s=$('said');if(s)s.textContent=pending?`我聽到：「${pending}」`:'';const k=$('sok');if(k)k.disabled=!pending;const i=$('typed');if(i&&i.value!==pending&&document.activeElement!==i)i.value=pending}
function answer(){
 if(!pending)return;const n=NODES[node];said[n.p]=pending;queue(n.p);
 if(n.p===4)queue(5);
 if(n.p===6){queue(7);queue(8)}
 node++;pending='';
 const L=$('L'),a=L.querySelector('.ask');if(a){a.outerHTML=askHtml()}
 if(cur>=2&&cur<=8){paintImg();paintCap()}
 if(node<NODES.length)say(NODES[node].q);
}

/* ---------- 完成：小書 ---------- */
async function finale(){
 mode='cover';clearTimeout(timer);
 $('ma').textContent='';$('bk').classList.add('shrunk');$('mini').className='mini on';
 say('你的故事書完成了！');
 await sleep(2400*TM());
 mode='read';cur=1;spreadHtml(1);
 $('mini').classList.add('opening');$('bk').classList.remove('shrunk');
 await sleep(1500*TM());
 $('mini').className='mini';$('nav').classList.add('on');navState();
}
function navState(){$('nextp').style.visibility=cur>=9?'hidden':'visible'}
async function nav(n){
 if(flipping||mode!=='read')return;n=Math.max(1,Math.min(9,n));if(n===cur)return;
 await go(n,n>cur?1:-1);navState();
}
async function nameDone(){
 const v=($('nm').value||'').trim();if(!v){$('nhint').textContent='請先說出或寫下名字喔';return}
 book.author=v;try{localStorage.setItem('rh_book',JSON.stringify(book))}catch(_){}
 mode='done';$('nav').classList.remove('on');
 spreadHtml(9);
 await sleep(900*TM());
 $('ma').textContent='作者：'+v;$('bk').classList.add('shrunk');$('mini').className='mini on';
 await sleep(1300*TM());
 $('mini').classList.add('left');await sleep(900*TM());$('side').classList.add('on');
 say('做好了！可以列印，或是帶走。');
}
function nameHeard(all,first){
 const t=first.replace(/[。，,.！!？?\s]/g,'').replace(/^(我叫|我是|名字是|叫做|叫)/,'');
 $('nm').value=t;$('nhint').textContent=`聽到：「${first}」 ✓（不對可以直接改）`;
}

/* ---------- 事件 ---------- */
const A={
 opt:b=>{talk=true;choose(b.dataset.id)},
 dot:b=>{talk=true;goStep(+b.dataset.i)},
 back:()=>{talk=true;goStep(step-1)},back2:()=>goStep(Q.length-1),
 next:()=>{talk=true;goStep(step+1)},
 mic:()=>listen('mic','heard',heardAns),
 sayq:()=>{talk=true;say(Q[step].t)},
 send:()=>{talk=true;dbg('已送出，正在畫圖，請等 15～30 秒⋯');genChar().then(()=>{$('dbg').style.display='none'})},
 again:()=>genChar(),
 pick:b=>{chosen=b.dataset.u;document.querySelectorAll('.cands img').forEach(x=>x.classList.toggle('pick',x===b));const d=$('done');if(d)d.disabled=false},
 done:()=>{if(!chosen)return;talk=true;sessionStorage.setItem('rh_char',JSON.stringify({url:chosen,ans}));startStory()},
 chip:b=>{talk=true;setSaid(b.textContent)},
 smic:()=>listen('smic','said',(a,f)=>setSaid(f)),
 sok:()=>answer(),
 sq:()=>{talk=true;if(node<NODES.length)say(NODES[node].q)},
 retry:b=>{const p=+b.dataset.p;st[p]='busy';paintImg();chain=chain.then(()=>genPage(p))},
 nextp:()=>nav(cur+1),prevp:()=>nav(cur-1),lastp:()=>nav(9),
 nmic:()=>listen('nmic','nhint',nameHeard),
 nameok:()=>nameDone(),
 print:()=>window.open('print.html','_blank'),
 dl:()=>window.open('print.html?dl=1','_blank'),
 restart:()=>location.reload()
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&A[b.dataset.act])try{A[b.dataset.act](b)}catch(err){dbg('按鈕錯誤：'+err.message)}});
document.addEventListener('input',e=>{if(e.target.id==='typed')setSaid(e.target.value)});
paintDesign();
</script>
</body>
</html>
